version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Здесь можно передать переменные окружения для строки подключения
      # Пока наше приложение использует жёстко заданную строку, но скоро мы это исправим
      DATABASE_URL: "postgres://postgres:secret@db:5432/postgres?sslmode=disable"
    restart: on-failure

volumes:
  pgdata:
